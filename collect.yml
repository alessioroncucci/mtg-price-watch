name: Raccolta prezzi

on:
  schedule:
    # 05:00 UTC = 07:00 in Italia d'estate, 06:00 d'inverno.
    # GitHub puo' ritardare i job pianificati di qualche decina di minuti: per
    # prezzi che Scryfall aggiorna una volta al giorno e' del tutto irrilevante.
    - cron: "0 5 * * *"
  workflow_dispatch:        # bottone "Run workflow" per lanciarla a mano

concurrency:
  group: raccolta-prezzi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # per ricommittare data/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli i prezzi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Regola qui il comportamento del collector (opzionale).
          MPW_THRESHOLD: "3"
          MPW_MAX_CARDS: "2500"
          MPW_KEEP_DAYS: "180"
          MPW_PCT: "20"
          MPW_SIGMA: "2"
          MPW_WINDOW: "30"
          MPW_MIN_OBS: "5"
        run: python collect.py

      - name: Prepara il sito
        run: |
          cp app/index.html public/index.html
          cp app/sw.js public/sw.js
          cp app/manifest.webmanifest public/manifest.webmanifest

      - name: Salva lo storico nel repo
        run: |
          git config user.name  "mtg-price-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna variazione da salvare."
          else
            git commit -m "Prezzi del $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
